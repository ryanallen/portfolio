<svg xmlns="http://www.w3.org/2000/svg" viewBox="-40 -40 260 300">
  <defs>
    <linearGradient id="face" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5fd0ff"/>
      <stop offset=".45" stop-color="#0a8fe0"/>
      <stop offset="1" stop-color="#0052a3"/>
    </linearGradient>
    <linearGradient id="side" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#003a73"/>
      <stop offset="1" stop-color="#001a38"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2=".6" y2=".9">
      <stop offset="0" stop-color="#fff" stop-opacity=".75"/>
      <stop offset=".35" stop-color="#fff" stop-opacity=".12"/>
      <stop offset=".6" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff" stop-opacity=".9"/>
      <stop offset="1" stop-color="#9fe3ff" stop-opacity=".2"/>
    </linearGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="22"/></filter>
