  <polygon points="0,0 0,204 134,102" fill="#0a8fe0" opacity=".55" filter="url(#glow)"/>
  <g stroke-linejoin="round" stroke-width="16">
    <polygon points="0,0 0,204 134,102" transform="translate(18 22)" fill="url(#side)" stroke="url(#side)"/>
    <polygon points="0,0 0,204 134,102" transform="translate(15 18)" fill="url(#side)" stroke="url(#side)"/>
    <polygon points="0,0 0,204 134,102" transform="translate(12 14.5)" fill="url(#side)" stroke="url(#side)"/>
    <polygon points="0,0 0,204 134,102" transform="translate(9 11)" fill="#00305e" stroke="#00305e"/>
    <polygon points="0,0 0,204 134,102" transform="translate(6 7.3)" fill="#003f7a" stroke="#003f7a"/>
    <polygon points="0,0 0,204 134,102" transform="translate(3 3.6)" fill="#004c91" stroke="#004c91"/>
    <polygon points="0,0 0,204 134,102" fill="url(#face)" stroke="url(#face)"/>
  </g>
  <polygon points="0,0 0,204 134,102" fill="url(#shine)" stroke="url(#shine)" stroke-width="16" stroke-linejoin="round"/>
  <polyline points="0,204 0,0 134,102" fill="none" stroke="url(#rim)" stroke-width="1.6" stroke-linejoin="round" transform="translate(-7.4 -5.6) scale(1.02)" opacity=".8"/>
