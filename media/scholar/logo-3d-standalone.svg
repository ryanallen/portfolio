<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-labelledby="title desc">
  <title id="title">Scholar</title>
  <desc id="desc">A softly rounded lavender tile with four raised pearlescent points.</desc>
  <defs>
    <linearGradient id="body" x1=".08" y1=".02" x2=".9" y2=".98" gradientUnits="objectBoundingBox">
      <stop offset="0" stop-color="#d5caff"/>
      <stop offset=".17" stop-color="#c2affc"/>
      <stop offset=".48" stop-color="#a17bf3"/>
      <stop offset=".76" stop-color="#9269e9"/>
      <stop offset="1" stop-color="#7650d5"/>
    </linearGradient>
    <radialGradient id="light" cx=".13" cy=".07" r=".95" gradientUnits="objectBoundingBox">
      <stop offset="0" stop-color="#fff" stop-opacity=".4"/>
      <stop offset=".21" stop-color="#f7efff" stop-opacity=".17"/>
      <stop offset=".66" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="depth" cx=".86" cy=".92" r=".82" gradientUnits="objectBoundingBox">
      <stop offset="0" stop-color="#522ab5" stop-opacity=".35"/>
      <stop offset=".6" stop-color="#7149d3" stop-opacity=".09"/>
      <stop offset="1" stop-color="#7149d3" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="rim" x1=".05" y1=".03" x2=".95" y2=".96" gradientUnits="objectBoundingBox">
      <stop offset="0" stop-color="#fff" stop-opacity=".8"/>
      <stop offset=".35" stop-color="#fff" stop-opacity=".1"/>
      <stop offset=".8" stop-color="#5326ac" stop-opacity=".1"/>
      <stop offset="1" stop-color="#48249f" stop-opacity=".58"/>
    </linearGradient>
    <linearGradient id="pearl" x1=".16" y1=".08" x2=".86" y2=".94" gradientUnits="objectBoundingBox">
      <stop offset="0" stop-color="#fff"/>
      <stop offset=".3" stop-color="#fcfaff"/>
      <stop offset=".7" stop-color="#e7ddff"/>
      <stop offset="1" stop-color="#c9b9fa"/>
    </linearGradient>
    <linearGradient id="rayEdge" x1="0" y1="0" x2="1" y2="1" gradientUnits="objectBoundingBox">
      <stop offset="0" stop-color="#fff" stop-opacity=".75"/>
      <stop offset=".48" stop-color="#fff" stop-opacity=".08"/>
      <stop offset="1" stop-color="#a890e8" stop-opacity=".45"/>
    </linearGradient>
    <filter id="tileShadow" x="-15%" y="-15%" width="130%" height="140%">
      <feDropShadow dx="0" dy="20" stdDeviation="22" flood-color="#100626" flood-opacity=".25"/>
    </filter>
    <filter id="rayShadow" x="-35%" y="-35%" width="170%" height="190%">
      <feDropShadow dx="8" dy="17" stdDeviation="12" flood-color="#4b2c9c" flood-opacity=".49"/>
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#7f5ddd" flood-opacity=".22"/>
    </filter>
    <clipPath id="tileClip"><rect x="32" y="32" width="960" height="960" rx="232"/></clipPath>
    <path id="ray" d="M512 183c-10 0-16 10-19 21l-61 177c-3 13 1 22 11 29l54 38c9 7 21 7 30 0l54-38c10-7 14-16 11-29l-61-177c-3-11-9-21-19-21Z"/>
  </defs>
  <g filter="url(#tileShadow)">
    <rect x="32" y="38" width="960" height="954" rx="232" fill="#6846c6"/>
    <rect x="32" y="32" width="960" height="960" rx="232" fill="url(#body)"/>
    <g clip-path="url(#tileClip)">
      <rect x="32" y="32" width="960" height="960" fill="url(#light)"/>
      <rect x="32" y="32" width="960" height="960" fill="url(#depth)"/>
    </g>
    <rect x="35" y="35" width="954" height="954" rx="229" fill="none" stroke="url(#rim)" stroke-width="7"/>
  </g>
  <g fill="url(#pearl)" stroke="url(#rayEdge)" stroke-width="3" filter="url(#rayShadow)">
    <use href="#ray"/>
    <use href="#ray" transform="rotate(90 512 512)"/>
    <use href="#ray" transform="rotate(180 512 512)"/>
    <use href="#ray" transform="rotate(270 512 512)"/>
  </g>
</svg>
